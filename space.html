<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Exploration - VR View</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(10, 20, 50, 0.85);
      padding: 15px 25px;
      border-radius: 20px;
      pointer-events: none;
      backdrop-filter: blur(8px);
      border: 2px solid #4488cc;
      box-shadow: 0 6px 25px rgba(0, 150, 255, 0.3);
    }
    #location {
      font-size: 24px;
      font-weight: bold;
      color: #88ccff;
      margin-bottom: 5px;
    }
    #hint {
      font-size: 14px;
      color: #aaccee;
    }
    #controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: rgba(20, 40, 80, 0.9);
      color: white;
      backdrop-filter: blur(5px);
      border: 2px solid #4488cc;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 100, 200, 0.3);
    }
    button:hover {
      background: rgba(40, 80, 160, 0.9);
      border-color: #88ccff;
      box-shadow: 0 6px 25px rgba(0, 150, 255, 0.5);
      transform: translateY(-2px);
    }
    button.active {
      background: rgba(0, 150, 255, 0.7);
      border-color: #ffffff;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.7);
    }
    canvas {
      display: block;
    }
    @media (max-width: 700px) {
      #ui { padding: 10px 18px; font-size: 14px; }
      #location { font-size: 18px; }
      button { padding: 10px 16px; font-size: 13px; }
      #controls { gap: 8px; bottom: 20px; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="location">🌍 Earth Orbit</div>
    <div id="hint">Drag to look • Scroll to zoom • Click buttons to travel</div>
  </div>
  <div id="controls">
    <button id="btn-earth" class="active">🌍 Earth</button>
    <button id="btn-moon">🌙 Moon</button>
    <button id="btn-spaceship">🚀 Spaceship</button>
    <button id="btn-station">🛰️ Space Station</button>
    <button id="btn-mars">🔴 Mars</button>
    <button id="btn-jupiter">🪐 Jupiter</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000011);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.5;
    controls.zoomSpeed = 1.2;
    controls.minDistance = 1.5;
    controls.maxDistance = 50;
    controls.target.set(0, 0, 0);
    controls.update();

    // --- STARFIELD ---
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 3000;
    const starsPositions = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i += 3) {
      starsPositions[i] = (Math.random() - 0.5) * 200;
      starsPositions[i+1] = (Math.random() - 0.5) * 200;
      starsPositions[i+2] = (Math.random() - 0.5) * 200;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, blending: THREE.AdditiveBlending, depthWrite: false });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // --- LIGHTING ---
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(20, 10, 20);
    scene.add(sunLight);
    const ambientLight = new THREE.AmbientLight(0x222244);
    scene.add(ambientLight);

    // --- PLANETS & LOCATIONS ---
    const locations = {};
    
    // Earth
    const earthGroup = new THREE.Group();
    const earthGeo = new THREE.SphereGeometry(1.2, 48, 48);
    const earthTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthMat = new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.4, metalness: 0.1 });
    const earthMesh = new THREE.Mesh(earthGeo, earthMat);
    earthGroup.add(earthMesh);
    
    const cloudGeo = new THREE.SphereGeometry(1.22, 48, 48);
    const cloudTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
    const cloudMat = new THREE.MeshStandardMaterial({ map: cloudTex, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
    const clouds = new THREE.Mesh(cloudGeo, cloudMat);
    earthGroup.add(clouds);
    earthGroup.position.set(0, 0, 0);
    scene.add(earthGroup);
    locations.earth = { group: earthGroup, pos: new THREE.Vector3(0, 0, 0), camPos: new THREE.Vector3(0, 3, 5), target: new THREE.Vector3(0, 0, 0) };

    // Moon
    const moonGroup = new THREE.Group();
    const moonGeo = new THREE.SphereGeometry(0.4, 32, 32);
    const moonTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
    const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.8 });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonGroup.add(moonMesh);
    moonGroup.position.set(5, 0.5, 3);
    scene.add(moonGroup);
    locations.moon = { group: moonGroup, pos: moonGroup.position, camPos: new THREE.Vector3(5, 1.5, 4.5), target: moonGroup.position };

    // Mars
    const marsGroup = new THREE.Group();
    const marsGeo = new THREE.SphereGeometry(0.7, 32, 32);
    const marsTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/mars_1024.jpg');
    const marsMat = new THREE.MeshStandardMaterial({ map: marsTex, roughness: 0.7 });
    const marsMesh = new THREE.Mesh(marsGeo, marsMat);
    marsGroup.add(marsMesh);
    marsGroup.position.set(-7, -1, 6);
    scene.add(marsGroup);
    locations.mars = { group: marsGroup, pos: marsGroup.position, camPos: new THREE.Vector3(-7, 1, 8), target: marsGroup.position };

    // Jupiter
    const jupiterGroup = new THREE.Group();
    const jupiterGeo = new THREE.SphereGeometry(2.0, 48, 48);
    const jupiterTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/jupiter_1024.jpg');
    const jupiterMat = new THREE.MeshStandardMaterial({ map: jupiterTex, roughness: 0.5 });
    const jupiterMesh = new THREE.Mesh(jupiterGeo, jupiterMat);
    jupiterGroup.add(jupiterMesh);
    
    const ringGeo = new THREE.TorusGeometry(2.4, 0.15, 16, 64);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xc8b89a, roughness: 0.4, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.2;
    jupiterGroup.add(ring);
    jupiterGroup.position.set(8, -2, -10);
    scene.add(jupiterGroup);
    locations.jupiter = { group: jupiterGroup, pos: jupiterGroup.position, camPos: new THREE.Vector3(8, 2, -6), target: jupiterGroup.position };

    // --- SPACESHIP ---
    const spaceshipGroup = new THREE.Group();
    const hullGeo = new THREE.CylinderGeometry(0.3, 0.5, 1.5, 8);
    const hullMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3, metalness: 0.8 });
    const hull = new THREE.Mesh(hullGeo, hullMat);
    hull.rotation.x = Math.PI / 2;
    spaceshipGroup.add(hull);
    
    const noseGeo = new THREE.ConeGeometry(0.3, 0.6, 8);
    const noseMat = new THREE.MeshStandardMaterial({ color: 0xff4444, roughness: 0.2, metalness: 0.6 });
    const nose = new THREE.Mesh(noseGeo, noseMat);
    nose.position.z = 1.0;
    nose.rotation.x = Math.PI / 2;
    spaceshipGroup.add(nose);
    
    const wingGeo = new THREE.BoxGeometry(1.2, 0.05, 0.3);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.7 });
    const wings = new THREE.Mesh(wingGeo, wingMat);
    wings.position.z = -0.1;
    spaceshipGroup.add(wings);
    
    const engineGeo = new THREE.CylinderGeometry(0.15, 0.2, 0.4, 8);
    const engineMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.2, metalness: 0.9, emissive: new THREE.Color(0x000033) });
    const engine = new THREE.Mesh(engineGeo, engineMat);
    engine.position.z = -0.85;
    engine.rotation.x = Math.PI / 2;
    spaceshipGroup.add(engine);
    
    spaceshipGroup.position.set(2, 2, -3);
    scene.add(spaceshipGroup);
    locations.spaceship = { group: spaceshipGroup, pos: spaceshipGroup.position, camPos: new THREE.Vector3(1, 3.5, -1), target: spaceshipGroup.position };

    // --- SPACE STATION ---
    const stationGroup = new THREE.Group();
    const coreGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
    const coreMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.7 });
    const core = new THREE.Mesh(coreGeo, coreMat);
    stationGroup.add(core);
    
    const ringStationGeo = new THREE.TorusGeometry(0.9, 0.15, 16, 32);
    const ringStation = new THREE.Mesh(ringStationGeo, coreMat);
    ringStation.rotation.x = Math.PI / 2;
    stationGroup.add(ringStation);
    
    const solarPanelGeo = new THREE.BoxGeometry(1.5, 0.02, 0.4);
    const solarMat = new THREE.MeshStandardMaterial({ color: 0x2244aa, roughness: 0.5, metalness: 0.3, emissive: new THREE.Color(0x001122) });
    const panelL = new THREE.Mesh(solarPanelGeo, solarMat);
    panelL.position.x = -1.5;
    stationGroup.add(panelL);
    const panelR = new THREE.Mesh(solarPanelGeo, solarMat);
    panelR.position.x = 1.5;
    stationGroup.add(panelR);
    
    stationGroup.position.set(-3, 3, -4);
    scene.add(stationGroup);
    locations.station = { group: stationGroup, pos: stationGroup.position, camPos: new THREE.Vector3(-2, 5, -1.5), target: stationGroup.position };

    // --- CSS2D Labels ---
    function createLabel(text, position, color='#88ccff') {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.color = 'white';
      div.style.fontWeight = 'bold';
      div.style.fontSize = '16px';
      div.style.background = 'rgba(10,20,50,0.9)';
      div.style.padding = '4px 16px';
      div.style.borderRadius = '20px';
      div.style.border = '1px solid ' + color;
      const label = new CSS2DObject(div);
      label.position.copy(position);
      return label;
    }
    
    scene.add(createLabel('🌍 Earth', new THREE.Vector3(0, 1.7, 0), '#4488ff'));
    scene.add(createLabel('🌙 Moon', new THREE.Vector3(5, 1.1, 3), '#cccccc'));
    scene.add(createLabel('🔴 Mars', new THREE.Vector3(-7, -0.1, 6), '#ff6644'));
    scene.add(createLabel('🪐 Jupiter', new THREE.Vector3(8, -0.8, -10), '#c8b89a'));
    scene.add(createLabel('🚀 Spaceship', new THREE.Vector3(2, 3.2, -3), '#ff8888'));
    scene.add(createLabel('🛰️ Space Station', new THREE.Vector3(-3, 4.5, -4), '#88ff88'));

    // --- TELEPORT FUNCTION ---
    function teleportTo(locationName) {
      const loc = locations[locationName];
      if (!loc) return;
      
      const targetPos = loc.pos.clone();
      const camTarget = loc.target.clone();
      const camPos = loc.camPos.clone();
      
      // Animate camera
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const startTime = performance.now();
      const duration = 1500;
      
      function animateTransition(time) {
        const elapsed = time - startTime;
        const t = Math.min(elapsed / duration, 1.0);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        
        camera.position.lerpVectors(startPos, camPos, ease);
        controls.target.lerpVectors(startTarget, camTarget, ease);
        controls.update();
        
        if (t < 1) {
          requestAnimationFrame(animateTransition);
        }
      }
      
      requestAnimationFrame(animateTransition);
      
      document.getElementById('location').textContent = 
        locationName === 'earth' ? '🌍 Earth Orbit' :
        locationName === 'moon' ? '🌙 Moon Surface' :
        locationName === 'mars' ? '🔴 Mars Orbit' :
        locationName === 'jupiter' ? '🪐 Jupiter Orbit' :
        locationName === 'spaceship' ? '🚀 Spaceship' :
        '🛰️ Space Station';
      
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + locationName)?.classList.add('active');
    }

    // --- BUTTON EVENTS ---
    document.getElementById('btn-earth').addEventListener('click', () => teleportTo('earth'));
    document.getElementById('btn-moon').addEventListener('click', () => teleportTo('moon'));
    document.getElementById('btn-spaceship').addEventListener('click', () => teleportTo('spaceship'));
    document.getElementById('btn-station').addEventListener('click', () => teleportTo('station'));
    document.getElementById('btn-mars').addEventListener('click', () => teleportTo('mars'));
    document.getElementById('btn-jupiter').addEventListener('click', () => teleportTo('jupiter'));

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    
    function animate() {
      const elapsedTime = performance.now() * 0.001;
      
      // Rotate planets
      earthMesh.rotation.y += 0.005;
      clouds.rotation.y += 0.007;
      moonMesh.rotation.y += 0.002;
      marsMesh.rotation.y += 0.003;
      jupiterMesh.rotation.y += 0.008;
      
      // Spaceship hover
      spaceshipGroup.position.y = 2 + Math.sin(elapsedTime * 1.5) * 0.2;
      spaceshipGroup.rotation.z = Math.sin(elapsedTime * 0.8) * 0.1;
      
      // Space station rotation
      stationGroup.rotation.y += 0.008;
      stationGroup.children[1].rotation.z += 0.01;
      
      // Moon orbit around Earth
      moonGroup.position.x = 5 * Math.cos(elapsedTime * 0.3);
      moonGroup.position.z = 3 * Math.sin(elapsedTime * 0.3);
      
      // Twinkling stars
      stars.rotation.y += 0.0001;
      
      controls.update();
      
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    
    animate();

    // --- RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('🚀 Space Exploration ready! Fly around planets, visit the Moon, enter spaceship, explore station!');
  </script>
</body>
</html>
